name: Feature request
description: An idea for something Thumbly should do.
title: "Idea: "
body:
  - type: markdown
    attributes:
      value: |
        Ideas from people who use Thumbly are welcome. You do not need to know how to build it.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job, not the technical design. A sentence or two is enough.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would make that easier?
    validations:
      required: true
